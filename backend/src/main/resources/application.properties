spring.application.name=drinksaver

spring.datasource.url=${POSTGRES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Off by default. Every statement logged here carries the UUIDs of users whose
# drink history it touches, which makes the log a copy of consumption data held
# under whatever retention and access control the log sink happens to have rather
# than the database's. Turn it on per environment when debugging a query.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
# Explicit rather than relying on Kubernetes auto-detection, so the liveness/readiness health
# groups the Helm chart's probes target also exist in plain docker-compose.
management.endpoint.health.probes.enabled=true