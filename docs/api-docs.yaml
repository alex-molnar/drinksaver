components:
  schemas:
    Drink:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
          description: >-
            Set by the server from the authenticated JWT subject. A value sent
            by the client is not bound and has no effect.
        date:
          type: string
        alcoholTypeId:
          type: integer
          format: int32
        alcoholSubtypeId:
          type: integer
          format: int32
        alcoholVolumeId:
          type: integer
          format: int32
        brandId:
          type: integer
          format: int32
        beerFlavourId:
          type: integer
          format: int32
        consumptionTypeId:
          type: integer
          format: int32
        colorPaletteId:
          type: integer
          format: int32
        glasswareId:
          type: integer
          format: int32
        comments:
          type: string
          maxLength: 255
          description: Longer than the column, so longer than this is rejected with a 400.
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: >-
            Number of identical rows to write. Absent means one. Anything outside
            1 to 100 is rejected with a 400.
        addToRecommendations:
          type: boolean
        onlyTemporarily:
          type: boolean
        name:
          type: string
    SavedDrink:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: string
          format: uuid
        date:
          type: string
        alcoholTypeId:
          type: integer
          format: int32
        alcoholSubtypeId:
          type: integer
          format: int32
        alcoholVolumeId:
          type: integer
          format: int32
        brandId:
          type: integer
          format: int32
        beerFlavourId:
          type: integer
          format: int32
        consumptionTypeId:
          type: integer
          format: int32
        colorPaletteId:
          type: integer
          format: int32
        glasswareId:
          type: integer
          format: int32
        comments:
          type: string
    NewBeerBrand:
      type: object
      required: [name, colorPaletteId]
      properties:
        name:
          type: string
          maxLength: 100
        flavours:
          type: array
          items:
            type: string
        colorPaletteId:
          type: integer
          format: int32
    NewConsumptionType:
      type: object
      required: [name, glasswareId]
      properties:
        name:
          type: string
        glasswareId:
          type: integer
          format: int32
    UpdateBeerBrand:
      type: object
      description: Omitted or null fields are left unchanged.
      properties:
        name:
          type: [string, "null"]
        colorPaletteId:
          type: [integer, "null"]
          format: int32
    Brand:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: string
          format: uuid
        name:
          type: string
        colorPaletteId:
          type: integer
          format: int32
    NewBeerFlavour:
      type: object
      required: [name, colorPaletteId]
      properties:
        name:
          type: string
          maxLength: 100
        colorPaletteId:
          type: integer
          format: int32
    BeerFlavour:
      type: object
      properties:
        id:
          type: integer
          format: int32
        brandId:
          type: integer
          format: int32
        userId:
          type: string
          format: uuid
        name:
          type: string
        colorPaletteId:
          type: integer
          format: int32
    UpdateBeerFlavour:
      type: object
      description: Omitted or null fields are left unchanged.
      properties:
        name:
          type: [string, "null"]
        colorPaletteId:
          type: [integer, "null"]
          format: int32
    NewAlcoholEntry:
      type: object
      required: [colorPaletteId, glasswareId]
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
          description: >-
            Set by the server from the authenticated JWT subject for user endpoints,
            or the configured admin UUID for default admin endpoints. A value sent
            by the client is not bound and has no effect.
        name:
          type: string
          maxLength: 100
        volumes:
          type: array
          maxItems: 50
          description: >-
            Bounded because createAlcoholType is transactional and writes these one row
            at a time. More than 50 is rejected with a 400.
          items:
            $ref: "#/components/schemas/NewVolumeEntry"
        alcoholSubtypes:
          type: array
          maxItems: 50
          items:
            type: string
        colorPaletteId:
          type: integer
          format: int32
        glasswareId:
          type: integer
          format: int32
    NewVolumeEntry:
      type: object
      properties:
        name:
          type: string
        volume:
          type: number
          format: float
    AlcoholType:
      type: object
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: string
          format: uuid
        name:
          type: string
        volumeIds:
          type: array
          items:
            type: integer
            format: int32
        colorPaletteId:
          type: integer
          format: int32
        glasswareId:
          type: integer
          format: int32
    UpdateAlcoholType:
      type: object
      description: Omitted or null fields are left unchanged.
      properties:
        name:
          type: [string, "null"]
          maxLength: 100
        volumeIds:
          type: [array, "null"]
          maxItems: 50
          items:
            type: integer
            format: int32
        colorPaletteId:
          type: [integer, "null"]
          format: int32
        glasswareId:
          type: [integer, "null"]
          format: int32
    AlcoholVolume:
