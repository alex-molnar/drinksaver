openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /v1/drinks/new:
    post:
      tags:
      - drinks-controller
      operationId: saveDrink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Drink"
        required: true
      responses:
        "200":
          description: |
            Every row written, in insertion order. Always an array, including a single
            element one when quantity is absent or 1, so a client has one shape to handle.
            The caller needs all the ids to be able to undo the save.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedDrink"
        "400":
          description: quantity is outside 1 to 100
  /v1/beer/brands:
    get:
      tags:
      - beer-controller
      operationId: getBrandsList
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      tags:
      - beer-controller
      operationId: saveBrand
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBeerBrand"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Brand"
  /v1/beer/brands/{brandId}/flavours:
    get:
      tags:
      - beer-controller
      operationId: getBrandNames
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeerFlavour"
    post:
      tags:
      - beer-controller
      operationId: saveBrandName
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBeerFlavour"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BeerFlavour"
  /v1/alcohol/types:
    get:
      tags:
      - alcohol-controller
      operationId: getAlcoholTypes
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlcoholType"
    post:
      tags:
      - alcohol-controller
      operationId: createAlcoholType
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAlcoholEntry"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholType"
        "400":
          description: name, volumes or alcoholSubtypes is over its limit
  /v1/alcohol/types/{alcoholTypeId}/volumes:
    get:
      tags:
      - alcohol-controller
      operationId: getVolumesByAlcoholType
      parameters:
      - name: alcoholTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlcoholVolume"
    post:
      tags:
      - alcohol-controller
      operationId: saveVolumeForAlcoholType
      parameters:
      - name: alcoholTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewVolumeEntry"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholVolume"
        "404":
          description: no alcohol type with that id
  /v1/alcohol/types/{alcoholTypeId}/subtypes:
    get:
      tags:
      - alcohol-controller
      operationId: getSubtypesByAlcoholType
      parameters:
      - name: alcoholTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlcoholSubtype"
    post:
      tags:
      - alcohol-controller
      operationId: getSubtypesByAlcoholType_1
      parameters:
      - name: alcoholTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAlcoholSubtype"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholSubtype"
  /v1/recommendations/list:
    get:
      tags:
      - recommendations-controller
      operationId: getRecommendationsList
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
  /v1/recommendations/edit:
    patch:
      tags:
      - recommendations-controller
      operationId: reorderRecommendations
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RecommendationUpdate"
        required: true
      responses:
        "200":
          description: Updated recommendations with new order numbers and names
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
  /v1/recommendations/{id}:
    delete:
      tags:
      - recommendations-controller
      operationId: deleteRecommendation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Recommendation deleted
  /v1/drinks/date/{date}:
    get:
      tags:
      - drinks-controller
      operationId: getSavedDrinks
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EditableDrink"
  /v1/beer/consumption-types:
    get:
      tags:
      - beer-controller
      operationId: getConsumptionTypesList
      parameters:
      - name: amount
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsumptionType"
  /v1/design/color-palettes:
    get:
      tags:
      - design-controller
      operationId: getAvailableColorPalette
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColorPalette"
  /v1/design/glassware:
    get:
      tags:
      - design-controller
      operationId: getAvailableGlasswareIcons
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Glassware"
  /v1/drinks/byIds:
    delete:
      tags:
      - drinks-controller
      operationId: deleteSavedDrink
      parameters:
      - name: drinkIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: integer
                format: int32
  /v1/admin/recommendations/list:
    get:
      tags:
      - admin-recommendations-controller
      operationId: getRecommendationsList_1
      description: Admin only. The default recommendations every user starts with, sorted by orderNumber.
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefaultRecommendation"
        "403":
          description: caller is not in the /admin group
  /v1/admin/recommendations:
    post:
      tags:
      - admin-recommendations-controller
      operationId: createDefaultRecommendation
      description: Admin only. The new recommendation is placed after the current last one.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDefaultRecommendation"
        required: true
      responses:
        "200":
          description: The saved recommendation
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefaultRecommendation"
        "400":
          description: name, alcoholTypeId, colorPaletteId or glasswareId is missing
        "403":
          description: caller is not in the /admin group
  /v1/admin/recommendations/edit:
    patch:
      tags:
      - admin-recommendations-controller
      operationId: reorderRecommendations_1
      description: >-
        Admin only. Renumbers the listed recommendations 1..N in request order and
        sets their names. Send the full list: rows left out keep their old order number.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RecommendationUpdate"
        required: true
      responses:
        "200":
          description: All default recommendations, sorted by orderNumber
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefaultRecommendation"
        "400":
          description: an entry is missing id or name
        "403":
          description: caller is not in the /admin group
  /v1/admin/recommendations/{id}:
    delete:
      tags:
      - admin-recommendations-controller
      operationId: deleteRecommendation_1
      description: Admin only.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Recommendation deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no default recommendation with that id
  /v1/admin/design/color-palettes:
    get:
      tags:
      - admin-design-controller
      operationId: getAdminAvailableColorPalette
      description: Admin only. Lists all color palettes available to the design tools.
      responses:
        "200":
          description: Color palettes
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColorPalette"
        "403":
          description: caller is not in the /admin group
  /v1/admin/design/color-palette:
    post:
      tags:
      - admin-design-controller
      operationId: addColorPalette
      description: Admin only.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewColorPalette"
        required: true
      responses:
        "200":
          description: The saved color palette
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColorPalette"
        "400":
          description: name or field is missing
        "403":
          description: caller is not in the /admin group
  /v1/admin/design/color-palette/{id}:
    patch:
      tags:
      - admin-design-controller
      operationId: updateColorPalette
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateColorPalette"
        required: true
      responses:
        "200":
          description: Updated color palette
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColorPalette"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no color palette with that id
    delete:
      tags:
      - admin-design-controller
      operationId: deleteColorPalette
      description: Admin only. A palette referenced by existing design data or a saved drink cannot be deleted.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Color palette deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no color palette with that id
        "409":
          description: color palette is referenced by existing data
  /v1/admin/design/glassware:
    get:
      tags:
      - admin-design-controller
      operationId: getAdminAvailableGlasswareIcons
      description: Admin only. Lists all glassware icons available to the design tools.
      responses:
        "200":
          description: Glassware icons
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Glassware"
        "403":
          description: caller is not in the /admin group
    post:
      tags:
      - admin-design-controller
      operationId: addGlassware
      description: Admin only.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGlassware"
        required: true
      responses:
        "200":
          description: The saved glassware icon
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Glassware"
        "400":
          description: name, g or l is missing
        "403":
          description: caller is not in the /admin group
  /v1/admin/design/glassware/{id}:
    patch:
      tags:
      - admin-design-controller
      operationId: updateGlassware
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGlassware"
        required: true
      responses:
        "200":
          description: Updated glassware icon
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Glassware"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no glassware with that id
    delete:
      tags:
      - admin-design-controller
      operationId: deleteGlassware
      description: Admin only. Glassware referenced by existing design data or a saved drink cannot be deleted.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Glassware icon deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no glassware with that id
        "409":
          description: glassware is referenced by existing data
  /v1/admin/alcohol/types/{id}:
    patch:
      tags:
      - admin-alcohol-controller
      operationId: patchAlcoholType
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlcoholType"
      responses:
        "200":
          description: Updated alcohol type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholType"
        "400":
          description: name exceeds 100 characters or volumeIds contains more than 50 entries
        "403":
          description: caller is not in the /admin group
        "404":
          description: no alcohol type with that id
    delete:
      tags:
      - admin-alcohol-controller
      operationId: deleteAlcoholType
      description: Admin only. Deletes the alcohol type.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Alcohol type deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no alcohol type with that id
        "409":
          description: alcohol type is referenced by other records
  /v1/admin/alcohol/subtypes/{id}:
    patch:
      tags:
      - admin-alcohol-controller
      operationId: patchAlcoholSubtypeType
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlcoholSubtype"
      responses:
        "200":
          description: Updated alcohol subtype
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholSubtype"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no alcohol subtype with that id
    delete:
      tags:
      - admin-alcohol-controller
      operationId: deleteAlcoholSubtypeType
      description: Admin only. Deletes the alcohol subtype.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Alcohol subtype deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no alcohol subtype with that id
        "409":
          description: alcohol subtype is referenced by other records
  /v1/admin/beer/brands/{brandId}:
    patch:
      tags:
      - admin-beer-controller
      operationId: updateBrand
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBeerBrand"
      responses:
        "200":
          description: Updated brand
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Brand"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no brand with that id
    delete:
      tags:
      - admin-beer-controller
      operationId: deleteBrand
      description: Admin only. Deletes the brand.
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Brand deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no brand with that id
        "409":
          description: brand is referenced by other records
  /v1/admin/beer/brands/flavours/{beerFlavourId}:
    patch:
      tags:
      - admin-beer-controller
      operationId: updateBeerFlavour
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: beerFlavourId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBeerFlavour"
      responses:
        "200":
          description: Updated beer flavour
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BeerFlavour"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no beer flavour with that id
    delete:
      tags:
      - admin-beer-controller
      operationId: deleteBeerFlavour
      description: Admin only. Deletes the beer flavour.
      parameters:
      - name: beerFlavourId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Beer flavour deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no beer flavour with that id
        "409":
          description: beer flavour is referenced by other records
  /v1/admin/beer/consumption-types/{consumptionTypeId}:
    patch:
      tags:
      - admin-beer-controller
      operationId: updateConsumptionType
      description: Admin only. Applies the supplied non-null fields.
      parameters:
      - name: consumptionTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsumptionType"
      responses:
        "200":
          description: Updated consumption type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsumptionType"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no consumption type with that id
    delete:
      tags:
      - admin-beer-controller
      operationId: deleteConsumptionType
      description: Admin only. Deletes the consumption type.
      parameters:
      - name: consumptionTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Consumption type deleted
        "403":
          description: caller is not in the /admin group
        "404":
          description: no consumption type with that id
        "409":
          description: consumption type is referenced by other records
  /v1/admin/user-defined/alcohol/types/{alcoholTypeId}/publish:
    post:
      tags:
      - admin-alcohol-user-controller
      operationId: publishAlcoholType
      description: Admin only. Publishes a user-defined alcohol type as an admin default.
      parameters:
      - name: alcoholTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Published alcohol type
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholType"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no alcohol type with that id
  /v1/admin/user-defined/alcohol/types/subtypes/{alcoholSubTypeId}/publish:
    post:
      tags:
      - admin-alcohol-user-controller
      operationId: publishAlcoholSubtype
      description: Admin only. Publishes a user-defined alcohol subtype as an admin default.
      parameters:
      - name: alcoholSubTypeId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Published alcohol subtype
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AlcoholSubtype"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no alcohol subtype with that id
  /v1/admin/user-defined/beer/brands/{brandId}/publish:
    post:
      tags:
      - admin-beer-user-controller
      operationId: publishBrand
      description: Admin only. Publishes a user-defined beer brand as an admin default.
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Published beer brand
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Brand"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no brand with that id
  /v1/admin/user-defined/beer/brands/flavours/{beerFlavourId}/publish:
    post:
      tags:
      - admin-beer-user-controller
      operationId: publishBeerFlavour
      description: Admin only. Publishes a user-defined beer flavour as an admin default.
      parameters:
      - name: beerFlavourId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Published beer flavour
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BeerFlavour"
        "403":
          description: caller is not in the /admin group
        "404":
          description: no beer flavour with that id
  /v1/admin/default/alcohol/types:
    post:
      tags:
      - admin-alcohol-default-controller
      operationId: createDefaultAlcoholType
      description: >-
        Admin only. Creates a default alcohol type, optionally with volumes and subtypes. Ownership is set to the configured admin UUID, regardless of the caller or a submitted userId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAlcoholEntry"
      responses:
        "200":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlcoholType"
        "400":
          description: Invalid request body or parameters
        "401":
          description: Authentication required
        "403":
          description: caller is not in the /admin group
    get:
      tags:
      - admin-alcohol-default-controller
      operationId: getDefaultAlcoholTypes
      description: Admin only. Lists default alcohol types.
      responses:
        "200":
          description: Default alcohol types
