# Dependency updates.
#
# Added because the web test setup pulled in a large number of transitive dev
# dependencies whose install scripts run in CI, so staying current matters more
# than it used to. Those jobs check out with persist-credentials: false so a
# compromised dev dependency cannot read the workflow token from .git/config.
#
# GitHub Actions updates are proposed here; workflow references stay pinned to reviewed SHAs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the test toolchain rather than six. These move together and
      # are gated by the suite itself.
      web-testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@testing-library/*"
      web-lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
    ignore:
      # Held on the 6.x line. typescript-eslint caps its peer at
      # typescript ">=4.8.4 <6.1.0", and no published release lifts that, not
      # even the canary, so a major bump makes "npm ci" fail to resolve and
      # takes the web lint, build and test jobs down with it. Patch and minor
      # updates inside 6.x still come through as normal.
      #
      # Remove this once typescript-eslint declares support for TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # SHA-pinned actions are updated here, with the reviewed commit changes in a PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
