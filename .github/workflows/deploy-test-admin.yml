name: Deploy admin to test

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'admin/**'
      - 'deploy/values/admin-test.yaml'
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: deploy-test-admin
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, publish and deploy to drinksaver-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute version
        id: v
        env:
          OWNER_RAW: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          STAMP="$(date -u '+%Y-%m-%d-%H-%M-%S')"
          VERSION="${BASE}-${STAMP}"
          OWNER="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Stamp package version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' admin/package.json > admin/package.json.tmp
          mv admin/package.json.tmp admin/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Verify admin app and chart
        working-directory: admin
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:coverage
          npm run build
          helm lint helm/drinksaver-admin --values ../deploy/values/admin-test.yaml
          helm lint helm/drinksaver-admin --values ../deploy/values/admin-prod.yaml

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: admin
          push: true
          tags: ghcr.io/${{ steps.v.outputs.owner }}/drinksaver-admin:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package and push Helm chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ steps.v.outputs.owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GH_ACTOR" --password "$GH_TOKEN"
          helm package admin/helm/drinksaver-admin --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/drinksaver-admin-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Deploy to drinksaver-test
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ steps.v.outputs.owner }}
        run: |
          set -euo pipefail
          helm upgrade --install drinksaver-admin \
            "oci://ghcr.io/${OWNER}/charts/drinksaver-admin" \
            --version "$VERSION" \
            --namespace drinksaver-test \
            --values deploy/values/admin-test.yaml \
            --set image.tag="$VERSION" \
            --wait --timeout 5m

      - name: Report
        run: kubectl get deploy,pod,ingress -n drinksaver-test -l app.kubernetes.io/name=drinksaver-admin
