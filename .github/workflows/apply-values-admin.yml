name: Apply admin test values

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'deploy/values/admin-test.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-test-admin
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  apply:
    name: Reapply values to drinksaver-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Read released chart version
        id: rel
        run: |
          set -euo pipefail
          CHART="$(helm list -n drinksaver-test --filter '^drinksaver-admin$' -o json \
            | jq -r '.[0].chart // empty')"
          if [ -z "$CHART" ]; then
            echo '::error::No drinksaver-admin release in drinksaver-test. Run "Deploy admin to test" first.'
            exit 1
          fi
          VERSION="${CHART#drinksaver-admin-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Apply values
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          OWNER_RAW: ${{ github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          helm registry login ghcr.io --username "$GH_ACTOR" --password "$GH_TOKEN"
          helm upgrade drinksaver-admin \
            "oci://ghcr.io/${OWNER}/charts/drinksaver-admin" \
            --version "$VERSION" \
            --namespace drinksaver-test \
            --values deploy/values/admin-test.yaml \
            --set image.tag="$VERSION" \
            --wait --timeout 5m

      - name: Report
        run: kubectl get deploy,pod,ingress -n drinksaver-test -l app.kubernetes.io/name=drinksaver-admin
