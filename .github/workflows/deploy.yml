name: Deploy to production

# Manual only. This is the production cutover, so it never fires on a push.
on:
  workflow_dispatch:
    inputs:
      deploy-backend:
        description: 'Deploy the drinksaver-backend chart'
        type: boolean
        default: true
      deploy-web:
        description: 'Deploy the drinksaver-web chart'
        type: boolean
        default: true
      version:
        description: 'Version to pull from the registry. Leave empty to use the VERSION file.'
        type: string
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

# Context values are passed through env rather than interpolated into shell
# bodies. inputs.version is caller-supplied, and expanding it inline would let
# a dispatcher inject shell commands.
jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OWNER_RAW: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using supplied version ${VERSION}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            echo "No version supplied, using VERSION file: ${VERSION}"
          fi
          OWNER="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}"     >> "$GITHUB_OUTPUT"

  backend:
    name: Deploy backend
    needs: version
    if: ${{ inputs.deploy-backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          # umask first: the redirect below creates the file before chmod runs.
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Nothing is built here. The chart and image already exist, published by
      # the build workflow, and are pulled by version.
      - name: Deploy chart from registry
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ needs.version.outputs.owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GH_ACTOR" --password "$GH_TOKEN"
          helm upgrade --install drinksaver-backend \
            "oci://ghcr.io/${OWNER}/charts/drinksaver-backend" \
            --version "${VERSION}" \
            --namespace drinksaver \
            --values deploy/values/backend-prod.yaml \
            --set image.tag="${VERSION}" \
            --wait --timeout 5m

      - name: Report
        run: kubectl get deploy,pod,ingress -n drinksaver -l app.kubernetes.io/name=drinksaver-backend

  web:
    name: Deploy web
    needs: version
    if: ${{ inputs.deploy-web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          # umask first: the redirect below creates the file before chmod runs.
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy chart from registry
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ needs.version.outputs.owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GH_ACTOR" --password "$GH_TOKEN"
          helm upgrade --install drinksaver-web \
            "oci://ghcr.io/${OWNER}/charts/drinksaver-web" \
            --version "${VERSION}" \
            --namespace drinksaver \
            --values deploy/values/web-prod.yaml \
            --set image.tag="${VERSION}" \
            --wait --timeout 5m

      - name: Report
        run: kubectl get deploy,pod,ingress -n drinksaver -l app.kubernetes.io/name=drinksaver-web
