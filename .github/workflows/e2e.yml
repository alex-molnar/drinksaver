name: End-to-end tests

# Runs on main only, after a merge. Feature branch pushes stay fast; this gates
# the release rather than the branch. It drives the real stack through a real
# browser: Keycloak login, the backend, Postgres and the built web image.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the stack to be ready
        run: |
          set -euo pipefail
          # Poll rather than sleep: the backend builds from source here, so the
          # time to healthy varies a lot between a warm and a cold cache.
          #
          # The backend probe runs inside the container, the same way compose.yaml's own
          # healthcheck does. Actuator lives entirely on the management port now, which
          # compose deliberately does not publish, so the host cannot reach it:
          # http://localhost:8080/actuator/health answers 401, because the main port has
          # no actuator route and .anyRequest().authenticated() runs ahead of any
          # route-not-found handling. That is what this loop used to probe, so it could
          # never succeed and the whole e2e gate has been failing on readiness.
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:3000/ >/dev/null 2>&1 \
               && curl -fsS http://localhost:8081/auth/realms/drinksaver >/dev/null 2>&1; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          echo "::error::the stack did not become ready in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Wait for the seed data
        run: |
          set -euo pipefail
          # The journeys assert against seeded recommendations, so a green run
          # before seeding would be meaningless.
          for i in $(seq 1 30); do
            state=$(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' | awk '/^seed/ {print $2" "$3}')
            case "$state" in
              "exited 0") echo "seed completed"; exit 0 ;;
              "exited "*) echo "::error::seed failed: $state"; docker compose logs seed; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::seed did not finish"; docker compose logs seed; exit 1

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: web
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
