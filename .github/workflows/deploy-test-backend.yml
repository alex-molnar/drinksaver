name: Deploy backend to test

# Any push to a non-main branch that touches the backend. workflow_dispatch is included
# so a run can be repeated without an empty commit, and so a change confined to
# .github/workflows can be exercised.
on:
  push:
    branches-ignore:
      # main is handled by "Build and publish", which publishes artifacts, and
      # by "Deploy to production", which is manual. Nothing here should react to
      # a merge.
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

# Never let two runs perform overlapping helm upgrades on the same release.
concurrency:
  group: deploy-test-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# Context values are passed through env rather than interpolated into shell
# bodies, so nothing from the event payload can be parsed as shell.
jobs:
  deploy:
    name: Build, publish and deploy to drinksaver-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Compute version
        id: v
        env:
          OWNER_RAW: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          STAMP="$(date -u '+%Y-%m-%d-%H-%M-%S')"
          VERSION="${BASE}-${STAMP}"
          OWNER="$(printf '%s' "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}"     >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Stamp the version onto the Maven project so the JAR filename matches the
      # ARG the Dockerfile passes to COPY.
      - name: Set Maven project version
        working-directory: backend
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false

      - name: Build application
        working-directory: backend
        # verify, not package: the JaCoCo coverage check binds to the
        # verify phase, and package stops short of it.
        run: mvn -B --no-transfer-progress verify

      # disabledWithoutDocker means the integration tests skip rather than fail when
      # Docker is missing, which is right on a laptop and wrong here: a green build
      # that silently ran no integration tests is worse than a red one. The script
      # discovers the classes from the source tree, so adding one extends the guard.
      - name: Assert the integration tests actually ran
        working-directory: backend
        run: ./scripts/assert-integration-tests-ran.sh

      - name: Set up Buildx
        # The runner's default builder uses the docker driver, which cannot
        # export a GitHub Actions cache. A docker-container builder can.
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ steps.v.outputs.owner }}/drinksaver-backend:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package and push Helm chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ steps.v.outputs.owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GH_ACTOR" --password "$GH_TOKEN"
          helm package backend/drinksaver-backend \
            --version "$VERSION" --app-version "$VERSION" \
            --destination dist
          helm push "dist/drinksaver-backend-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          # umask first: the redirect below creates the file before chmod runs.
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # Deploy the chart that was just published, not the working copy, so the
      # published artifact is what actually gets exercised.
      - name: Deploy to drinksaver-test
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ steps.v.outputs.owner }}
        run: |
          set -euo pipefail
          helm upgrade --install drinksaver-backend \
            "oci://ghcr.io/${OWNER}/charts/drinksaver-backend" \
            --version "$VERSION" \
            --namespace drinksaver-test \
            --values deploy/values/backend-test.yaml \
            --set image.tag="$VERSION" \
            --wait --timeout 5m

      - name: Report
        run: kubectl get deploy,pod,ingress -n drinksaver-test -l app.kubernetes.io/name=drinksaver-backend
