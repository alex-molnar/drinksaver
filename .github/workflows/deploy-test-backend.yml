name: Deploy backend to test

# Any push on any branch that touches the backend. workflow_dispatch is included
# so a run can be repeated without an empty commit.
on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
  workflow_dispatch:

# Never let two runs perform overlapping helm upgrades on the same release.
concurrency:
  group: deploy-test-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, publish and deploy to drinksaver-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Compute version
        id: v
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          STAMP="$(date -u '+%Y-%m-%d-%H-%M-%S')"
          VERSION="${BASE}-${STAMP}"
          OWNER="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}"     >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Stamp the version onto the Maven project so the JAR filename matches the
      # ARG the Dockerfile passes to COPY.
      - name: Set Maven project version
        working-directory: backend
        run: |
          mvn -B --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="${{ steps.v.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build application
        working-directory: backend
        run: mvn -B --no-transfer-progress package

      - name: Set up Buildx
        # The runner's default builder uses the docker driver, which cannot
        # export a GitHub Actions cache. A docker-container builder can.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ steps.v.outputs.owner }}/drinksaver-backend:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          OWNER="${{ steps.v.outputs.owner }}"
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"
          helm package backend/drinksaver-backend \
            --version "${VERSION}" --app-version "${VERSION}" \
            --destination dist
          helm push "dist/drinksaver-backend-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Configure kubectl
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # Deploy the chart that was just published, not the working copy, so the
      # published artifact is what actually gets exercised.
      - name: Deploy to drinksaver-test
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          OWNER="${{ steps.v.outputs.owner }}"
          helm upgrade --install drinksaver-backend \
            "oci://ghcr.io/${OWNER}/charts/drinksaver-backend" \
            --version "${VERSION}" \
            --namespace drinksaver-test \
            --values deploy/values/backend-test.yaml \
            --set image.tag="${VERSION}" \
            --wait --timeout 5m

      - name: Report
        run: |
          kubectl get deploy,pod,ingress -n drinksaver-test -l app.kubernetes.io/name=drinksaver-backend
