# drinksaver-web, test environment (namespace drinksaver-test).
# Applied by .github/workflows/deploy-test-web.yml.
# Editing this file triggers "Apply web test values", which reapplies it to the
# chart version already released in drinksaver-test without rebuilding.
#
# These used to be Docker build arguments, which is why test needed its own
# image tag. They are runtime values now, so test and production share an image.

config:
  apiUrl: "https://test.api.drinksaver.kak.im"
  keycloakUrl: "https://auth.drinksaver.kak.im/auth"
  keycloakRealm: "test-drinksaver"
  # The client ID registered in Keycloak, not a local name.
  keycloakClientId: "test-drinksaver-web"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: test.app.drinksaver.kak.im
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: drinksaver-web-tls
      hosts:
        - test.app.drinksaver.kak.im
