name: DrinkSaver
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: "2.40.0"
configs:
  Local: debug
  Test: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
targets:
  DrinkSaver:
    type: application
    platform: iOS
    sources:
      - path: DrinkSaver
        excludes:
          - Info.plist
    resources:
      - path: DrinkSaver/Resources/LaunchScreen.storyboard
      - path: DrinkSaver/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.kak.drinksaver
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DrinkSaver/Info.plist
        MARKETING_VERSION: $(DRINKSAVER_VERSION)
        CURRENT_PROJECT_VERSION: $(DRINKSAVER_BUILD_NUMBER)
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        API_BASE_URL: $(API_BASE_URL)
        OIDC_ISSUER_URL: $(OIDC_ISSUER_URL)
        OIDC_CLIENT_ID: $(OIDC_CLIENT_ID)
        OIDC_REDIRECT_URL: $(OIDC_REDIRECT_URL)
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 777BH83DM5
      configs:
        Local:
          INFOPLIST_FILE: DrinkSaver/Info-Local.plist
    configFiles:
      Local: Config/Local.xcconfig
      Test: Config/Test.xcconfig
      Release: Config/Release.xcconfig
    scheme:
      testTargets:
        - DrinkSaverTests
        - DrinkSaverUITests
  DrinkSaverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DrinkSaverTests
    resources:
      - path: DrinkSaverTests/Fixtures/Configuration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.kak.drinksaver.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DrinkSaver
  DrinkSaverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DrinkSaverUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.kak.drinksaver.UITests
        TEST_TARGET_NAME: DrinkSaver
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DrinkSaver
schemes:
  DrinkSaver:
    build:
      targets:
        DrinkSaver: all
        DrinkSaverTests: [test]
        DrinkSaverUITests: [test]
    test:
      config: Test
      gatherCoverageData: true
      targets:
        - DrinkSaverTests
        - DrinkSaverUITests
    run:
      config: Local
    profile:
      config: Release
    analyze:
      config: Local
    archive:
      config: Release
