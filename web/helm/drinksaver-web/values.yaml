# Default values for drinksaver-web
replicaCount: 1

image:
  repository: ghcr.io/alex-molnar
  name: drinksaver-web
  pullPolicy: IfNotPresent

# Runtime configuration. docker-entrypoint.sh writes these into /config.js when
# the container starts, so nothing is baked into the bundle and one image can be
# promoted between environments unchanged.
config:
  apiUrl: "https://api.drinksaver.kak.im"
  keycloakUrl: "https://auth.drinksaver.kak.im/auth"
  keycloakRealm: "drinksaver"
  # A Keycloak client ID, not a local name. It must match a client that exists
  # in the realm above, and it differs per environment, so both values files
  # override it. See deploy/values/web-{test,prod}.yaml.
  keycloakClientId: "drinksaver-frontend"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  annotations: 
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: app.drinksaver.kak.im
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: drinksaver-tls
      hosts:
        - app.drinksaver.kak.im

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
